name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, schema, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://messline:messline@localhost:5434/messline?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: IST service-date regression checks
        run: npm run test:service-date
      - name: Prep service-date regression checks
        run: npm run test:prep
      - run: npx prisma validate
      - run: npm run lint
      - name: Production build
        run: npm run build
